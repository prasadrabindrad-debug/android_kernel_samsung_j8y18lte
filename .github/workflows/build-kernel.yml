name: Build Samsung Galaxy J8 Kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu:
        description: 'Include KernelSU'
        type: boolean
        required: true
        default: true
      ksu_variant:
        description: 'KernelSU variant'
        type: choice
        options:
          - backslashxx
          - tiann
        default: backslashxx
      ksu_ref:
        description: 'KernelSU branch/ref passed to setup.sh'
        type: string
        default: master
      nomount:
        description: 'Include NoMount (requires KernelSU)'
        type: boolean
        required: true
        default: true
      toolchain:
        description: 'Toolchain (gcc = LineageOS GCC 4.9 prebuilts, clang = proton-clang)'
        type: choice
        options:
          - gcc
          - clang
        default: gcc
      make_anykernel:
        description: 'Package AnyKernel3 Zip & Create Release'
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: lineage-18.1

      - name: Check Available Disk Space
        run: |
          echo "=== Disk Space Before Build ==="
          df -h
          free -h

      - name: Determine Input Flags & Environment
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "kernelsu=true" >> $GITHUB_OUTPUT
            echo "ksu_variant=backslashxx" >> $GITHUB_OUTPUT
            echo "ksu_ref=master" >> $GITHUB_OUTPUT
            echo "nomount=true" >> $GITHUB_OUTPUT
            echo "toolchain=gcc" >> $GITHUB_OUTPUT
            echo "make_anykernel=true" >> $GITHUB_OUTPUT
          else
            echo "kernelsu=${{ github.event.inputs.kernelsu }}" >> $GITHUB_OUTPUT
            echo "ksu_variant=${{ github.event.inputs.ksu_variant }}" >> $GITHUB_OUTPUT
            echo "ksu_ref=${{ github.event.inputs.ksu_ref }}" >> $GITHUB_OUTPUT
            echo "nomount=${{ github.event.inputs.nomount }}" >> $GITHUB_OUTPUT
            echo "toolchain=${{ github.event.inputs.toolchain }}" >> $GITHUB_OUTPUT
            echo "make_anykernel=${{ github.event.inputs.make_anykernel }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Host Build Dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            ca-certificates curl git zip unzip cpio rsync kmod lz4 xz-utils \
            python2 device-tree-compiler dwarves || \
          sudo apt-get install -y python-is-python3

          if [ -f /usr/bin/python2.7 ]; then
            sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
          elif command -v python2 &> /dev/null; then
            sudo ln -sf $(which python2) /usr/bin/python2
          elif command -v python &> /dev/null; then
            sudo ln -sf $(which python) /usr/bin/python2
          fi

          export PATH="/usr/bin:$PATH"
          python2 --version
          make --version || true
          gcc --version || true

      - name: Fetch Toolchain
        run: |
          set -Eeuo pipefail
          TC="$HOME/tc"; rm -rf "$TC"; mkdir -p "$TC"
          TOOLCHAIN="${{ steps.vars.outputs.toolchain }}"

          if [ "$TOOLCHAIN" = "gcc" ]; then
            git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$TC/a64"
            git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$TC/a32"
            echo "$TC/a64/bin" >> "$GITHUB_PATH"
            echo "$TC/a32/bin" >> "$GITHUB_PATH"
            echo "CROSS=aarch64-linux-android-" >> "$GITHUB_ENV"
            echo "CROSS32=arm-linux-androideabi-" >> "$GITHUB_ENV"
          else
            git clone --depth=1 https://github.com/kdrag0n/proton-clang "$TC/clang"
            echo "$TC/clang/bin" >> "$GITHUB_PATH"
            echo "CROSS=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            echo "CROSS32=arm-linux-gnueabi-" >> "$GITHUB_ENV"
            echo "CC_OVERRIDE=clang" >> "$GITHUB_ENV"
            echo "CLANG_TRIPLE_V=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          fi

      - name: Setup KernelSU and NoMount
        run: |
          if [ "${{ steps.vars.outputs.kernelsu }}" == "true" ]; then
            echo "==> Setting up KernelSU..."
            VARIANT="${{ steps.vars.outputs.ksu_variant }}"
            REF="${{ steps.vars.outputs.ksu_ref }}"
            
            if [ "$VARIANT" == "tiann" ]; then
              KSU_URL="https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
            else
              KSU_URL="https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh"
            fi
            
            curl -sSL --retry 5 --retry-delay 3 -o ksu_setup.sh "$KSU_URL"
            bash ksu_setup.sh "$REF"

            if [ "${{ steps.vars.outputs.nomount }}" == "true" ]; then
              echo "==> Setting up NoMount..."
              curl -sSL --retry 5 --retry-delay 3 -o nomount_setup.sh "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"
              bash nomount_setup.sh
            fi
          fi

      - name: Configure Kernel Flags & Validate .config Survival
        run: |
          set -Eeuo pipefail
          DEFCONFIG="arch/arm64/configs/j8y18lte_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "Error: Defconfig $DEFCONFIG not found!"
            exit 1
          fi

          if [ -n "$(tail -c1 "$DEFCONFIG")" ]; then echo >> "$DEFCONFIG"; fi

          set_cfg() {
            sed -i -E "/^(# )?CONFIG_$1(=| is not set)/d" "$DEFCONFIG"
            if [ "$2" = "n" ]; then echo "# CONFIG_$1 is not set" >> "$DEFCONFIG"
            else echo "CONFIG_$1=$2" >> "$DEFCONFIG"; fi
          }

          REQ_Y=()
          if [ "${{ steps.vars.outputs.kernelsu }}" == "true" ]; then
            set_cfg KSU y; REQ_Y+=(KSU)
          fi

          export ARCH=arm64
          export SUBARCH=arm64
          export HOSTCFLAGS="-fcommon -O2"

          rm -rf out
          make O=out j8y18lte_defconfig

          if [ "${{ steps.vars.outputs.kernelsu }}" == "true" ]; then
            for s in "${REQ_Y[@]}"; do
              if ! grep -qx "CONFIG_$s=y" out/.config; then
                echo "::error::CONFIG_$s=y did not survive into out/.config due to unmet dependencies."
                exit 1
              fi
            done
          fi

      - name: Patch KernelSU for Linux 3.18 Compatibility
        if: ${{ steps.vars.outputs.kernelsu == 'true' }}
        run: |
          echo "Applying precise fix for adb_root.c sign_extend64..."
          FILE="drivers/kernelsu/feature/adb_root.c"
          if [ -f "$FILE" ]; then
            # Find the line containing sign_extend64 and replace it safely, or cast the argument explicitly
            sed -i 's/sign_extend64(\([^)]*\))/sign_extend64((unsigned long)(\1))/g' "$FILE" || true
            
            # Fallback direct target replacement if the regex pattern differs slightly in backslashxx repo
            sed -i 's/sign_extend64(\(.*\))/sign_extend64((unsigned long)\1)/g' "$FILE" || true
            
            echo "Finished patching adb_root.c:"
            git diff "$FILE"
          fi

      - name: Compile Kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          export ARCH=arm64
          export SUBARCH=arm64
          export HOSTCFLAGS="-fcommon -O2"

          EXTRA_MAKE_ARGS=""
          if [ -n "${CC_OVERRIDE:-}" ]; then
            EXTRA_MAKE_ARGS="CC=$CC_OVERRIDE CLANG_TRIPLE=$CLANG_TRIPLE_V"
          fi

          start=$(date +%s)
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS" \
            CROSS_COMPILE_ARM32="$CROSS32" \
            $EXTRA_MAKE_ARGS > >(tee "$GITHUB_WORKSPACE/logs/build.log") 2>&1 || {
              echo "::error::Kernel compilation failed."
              exit 1
            }
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 Zip & Release
        if: ${{ steps.vars.outputs.make_anykernel == 'true' }}
        id: package
        run: |
          set -Eeuo pipefail
          AK3_DIR="AnyKernel3"
          rm -rf "$AK3_DIR"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK3_DIR"
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github"

          B="out/arch/arm64/boot"
          if [ -f "$B/Image.gz-dtb" ]; then
            cp "$B/Image.gz-dtb" "$AK3_DIR/"
          elif [ -f "$B/Image.gz" ]; then
            cp "$B/Image.gz" "$AK3_DIR/"
          else
            cp "$B/Image" "$AK3_DIR/Image"
            gzip -9 "$AK3_DIR/Image"
            mv "$AK3_DIR/Image.gz" "$AK3_DIR/Image.gz-dtb"
          fi

          if [ -f "$B/dts/qcom/sdm450.dtb" ]; then
            cp "$B/dts/qcom/sdm450.dtb" "$AK3_DIR/dtb"
          fi

          KSU_VER="none"
          NOMOUNT_VER="none"
          if [ -d "KernelSU" ]; then
            KSU_VER=$(git -C KernelSU describe --tags --always 2>/dev/null || echo "master")
          fi
          if [ -d "NoMount" ]; then
            NOMOUNT_VER=$(git -C NoMount describe --tags --always 2>/dev/null || echo "dev")
          fi

          BUILD_DATE=$(date -u +"%Y%m%d-%H%M")
          if [ "${{ steps.vars.outputs.kernelsu }}" == "true" ]; then
            ZIP_NAME="J8Kernel-lineage18.1-KSU-${KSU_VER}-NoMount-${NOMOUNT_VER}-${BUILD_DATE}.zip"
            RELEASE_TITLE="Galaxy J8 Kernel | KSU ${KSU_VER} | NoMount ${NOMOUNT_VER} | ${BUILD_DATE}"
          else
            ZIP_NAME="J8Kernel-lineage18.1-Stock-${BUILD_DATE}.zip"
            RELEASE_TITLE="Galaxy J8 Kernel | Stock | ${BUILD_DATE}"
          fi

          TAG_NAME="j8-kernel-${BUILD_DATE}"

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "NOMOUNT_VER=$NOMOUNT_VER" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          cd "$AK3_DIR"
          zip -r9 "../${ZIP_NAME}" .
          cd ..

      - name: Create GitHub Release
        if: ${{ steps.vars.outputs.make_anykernel == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ## Galaxy J8 Kernel (j8y18lte) - LineageOS 18.1

            | Property | Value |
            |---|---|
            | Device | Samsung Galaxy J8 (`j8y18lte`, SDM450) |
            | Toolchain | `${{ steps.vars.outputs.toolchain }}` |
            | KernelSU | `${{ env.KSU_VER }}` |
            | NoMount | `${{ env.NOMOUNT_VER }}` |
            | Build Date | `${{ env.BUILD_DATE }}` |

            Flash via custom recovery (TWRP/OrangeFox).
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
